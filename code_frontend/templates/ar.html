<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>AR-Preview: Drohnenfundorte & Info</title>

  <!-- A-Frame & AR.js -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <!-- GPS-Components für A-Frame -->
  <script src="https://unpkg.com/aframe-gps-camera-component@1.8.0/dist/aframe-gps-camera-component.min.js"></script>
  <script src="https://unpkg.com/aframe-gps-entity-place/dist/aframe-gps-entity-place.min.js"></script>

  <style>
    body, html { margin:0; padding:0; width:100%; height:100%; overflow:hidden; }
    #enableLocation {
      position: fixed; top: 80px; left: 50%; transform: translateX(-50%);
      z-index:20; padding:.5rem 1rem; background:rgba(0,0,0,0.6);
      color:#fff; border:none; border-radius:4px; font-size:1rem;
    }
    #infoOverlay {
      position: fixed; top:10px; right:10px;
      background:rgba(0,0,0,0.6); color:#fff;
      padding:.5rem; border-radius:4px;
      font-size:.85rem; line-height:1.2; z-index:20; max-width:200px;
    }
    #infoOverlay ul { margin:.25rem 0 0 1rem; padding:0; }
    #infoOverlay li { list-style:disc inside; margin:0; }
    #dbgPanel {
      position: fixed; bottom:10px; left:10px;
      background:rgba(0,0,0,0.8); color:#0f0;
      padding:.5rem; font-size:.8rem; z-index:999;
    }
  </style>
</head>
<body>

  <!-- AR-Szene -->
  <a-scene
    embedded vr-mode-ui="enabled: false"
    arjs="sourceType: webcam;
         debugUIEnabled: true;
         gpsMinDistance: 0;
         gpsMaxDistance: 100000;
         detectionMode: mono_and_matrix;">
    
    <!-- Assets preload -->
    <a-assets>
      {% for img in images %}
        <img id="asset-{{ loop.index }}"
             src="{{ url_for('image_file', filename=img.filename) }}">
      {% endfor %}
    </a-assets>

    <!-- Kamera mit GPS -->
    <a-camera gps-camera rotation-reader near="0.1" far="30000"></a-camera>

    <!-- Drohnenbilder -->
    {% for img in images %}
      <a-image
        id="marker-{{ loop.index }}"
        gps-entity-place="latitude: {{ img.lat }}; longitude: {{ img.lon }};"
        src="#asset-{{ loop.index }}"
        scale="20 20 20"
        look-at="[gps-camera]">
      </a-image>
    {% endfor %}
  </a-scene>

  <!-- Button für Standort-Permission -->
  <button id="enableLocation">Standort aktivieren</button>

  <!-- Info-Overlay -->
  <div id="infoOverlay">
    <div>Bilder: <span id="infoCount">0</span></div>
    <div>Entfernungen:</div>
    <ul id="infoDistances"></ul>
  </div>

  <!-- Debug-Panel -->
  <div id="dbgPanel">
    <div>GPS: <span id="dbg-gps">–</span></div>
  </div>

  <script>
    let currentPos = null;

    const targets = [
      {% for img in images if img.lat!="N/A" and img.lon!="N/A" %}
      { lat:{{ img.lat }}, lon:{{ img.lon }}, idx:{{ loop.index }} }{% if not loop.last %},{% endif %}
      {% endfor %}
    ];

    function computeDistance(lat1, lon1, lat2, lon2) {
      const R=6371000,
            φ1=lat1*Math.PI/180, φ2=lat2*Math.PI/180,
            Δφ=(lat2-lat1)*Math.PI/180, Δλ=(lon2-lon1)*Math.PI/180,
            a=Math.sin(Δφ/2)**2 + Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)**2;
      return 2*R*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function updateInfo() {
      document.getElementById('infoCount').textContent = targets.length;
      const ul = document.getElementById('infoDistances');
      ul.innerHTML = '';
      if (!currentPos) return;
      targets.forEach((t,i)=>{
        const d=computeDistance(
          currentPos.lat, currentPos.lon, t.lat, t.lon
        );
        const li=document.createElement('li');
        li.textContent=`#${i+1}: ${d.toFixed(0)} m`;
        ul.appendChild(li);
      });
    }

    document.querySelector('[gps-camera]')
      .addEventListener('gps-camera-update-position', ev=>{
        currentPos = {
          lat: ev.detail.position.latitude,
          lon: ev.detail.position.longitude
        };
        document.getElementById('dbg-gps').textContent =
          `${currentPos.lat.toFixed(5)}, ${currentPos.lon.toFixed(5)}`;
        updateInfo();
      });

    document.getElementById('enableLocation').addEventListener('click', () => {
        const btn = document.getElementById('enableLocation');
        if (!navigator.geolocation) {
            alert('Keine Geolocation-API vorhanden');
            return;
        }
        navigator.geolocation.getCurrentPosition(
            pos => {
            // Hier schon mal initial ein Update anzeigen
            currentPos = { lat: pos.coords.latitude, lon: pos.coords.longitude };
            document.getElementById('dbg-gps').textContent =
                `${currentPos.lat.toFixed(5)}, ${currentPos.lon.toFixed(5)}`;
            updateInfo();
            // Danach übernimmt AR.js selbst die weiteren Updates
            },
            err => {
            alert('Bitte Standortzugriff erlauben');
            },
            { enableHighAccuracy: true }
  );
  // Button ausblenden, egal ob Erfolg oder Abbruch
  btn.style.display = 'none';
});
    

    // Initiales Update
    updateInfo();
  </script>
</body>
</html>
